<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceCart AI - Automated E-commerce Voice Calls</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col items-center justify-center p-6">

    <div class="max-w-2xl w-full space-y-8 bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <span class="bg-blue-600/20 text-blue-400 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider border border-blue-500/30">
                Micro-SaaS Dashboard
            </span>
            <h1 class="text-4xl font-extrabold text-white">VoiceCart <span class="text-blue-500">AI</span></h1>
            <p class="text-slate-400 text-sm">Automated AI Voice Calls for Shopify, WooCommerce & YouCan</p>
        </div>

        <!-- Webhook URL Box -->
        <div class="space-y-3">
            <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider block">Your Store Webhook Endpoint:</label>
            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 flex items-center justify-between gap-4">
                <code id="webhookUrl" class="text-xs text-emerald-400 font-mono break-all">https://voicecart-ai.vercel.app/api/webhook</code>
                <button onclick="copyWebhook()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-2 rounded-lg font-medium transition">Copy</button>
            </div>
            <p class="text-xs text-slate-500">Paste this URL into your e-commerce store webhook settings to trigger instant calls.</p>
        </div>

        <!-- Configuration Form -->
        <div class="space-y-4 border-t border-slate-800 pt-6">
            <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Vapi Integration Settings</h2>
            
            <div class="space-y-2">
                <label class="text-xs text-slate-400 block">Vapi API Key</label>
                <input type="password" id="apiKey" placeholder="vapi-key-xxxxxxxx" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>

            <div class="space-y-2">
                <label class="text-xs text-slate-400 block">Assistant ID</label>
                <input type="text" id="assistantId" placeholder="assistant-id-xxxxxx" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>

            <button onclick="saveSettings()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl text-sm transition">Save Settings</button>
        </div>

        <!-- Status Footer -->
        <div class="text-center border-t border-slate-800 pt-4">
            <p id="statusMsg" class="text-xs text-slate-500">Status: System Ready & Secure</p>
        </div>

    </div>

    <script>
        function copyWebhook() {
            const url = document.getElementById('webhookUrl').innerText;
            navigator.clipboard.writeText(url);
            alert('Webhook URL copied to clipboard!');
        }

        function saveSettings() {
            const key = document.getElementById('apiKey').value;
            const assistant = document.getElementById('assistantId').value;
            if(!key || !assistant) {
                alert('Please fill in both fields.');
                return;
            }
            document.getElementById('statusMsg').innerText = 'Status: Settings Saved Successfully!';
            document.getElementById('statusMsg').className = 'text-xs text-emerald-400';
        }
    </script>
</body>
</html>
